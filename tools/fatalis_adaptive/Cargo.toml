[package]
name = "fatalis-adaptive"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Experimental Fatalis between-hunt adaptive THK plugin"

[lib]
name = "fatalis_adaptive"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fatalis-adaptive-tool"
path = "src/main.rs"

[[bin]]
name = "fatalis-ai"
path = "src/offline.rs"
required-features = ["offline-cli"]

[features]
# Optional manual diagnostics only; downstream code calls the Rust library API.
offline-cli = []
# Requires privately extracted, untracked game fixtures.
game-fixtures = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhai = { version = "1", features = ["serde"] }
sha2 = "0.10"

[profile.release]
panic = "unwind"
strip = "debuginfo"
